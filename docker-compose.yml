# TailorTom: API + Celery worker + Redis + Postgres + Caddy (e.g. on a VPS)
# From repo root: docker compose up -d --build
# For https://api.tailortom.org, point DNS to this host and run with Caddy.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tailortom-api
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_QUEUE_NAME: ${CELERY_QUEUE_NAME:-hosted}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tailortom

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tailortom-worker
    restart: unless-stopped
    command:
      - sh
      - -c
      - "celery -A worker.app worker --loglevel=info --concurrency=$${CELERY_WORKER_CONCURRENCY:-4} --queues=$${CELERY_QUEUE_NAME:-hosted}"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_QUEUE_NAME: ${CELERY_QUEUE_NAME:-hosted}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
      WORKER_MAX_TASKS_PER_CHILD: ${WORKER_MAX_TASKS_PER_CHILD:-25}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - tailortom

  postgres:
    image: postgres:16-alpine
    container_name: tailortom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tailortom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tailortom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tailortom

  redis:
    image: redis:7-alpine
    container_name: tailortom-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - tailortom

  caddy:
    image: caddy:2-alpine
    container_name: tailortom-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      api:
        condition: service_started
    networks:
      - tailortom

volumes:
  postgres_data:
  redis_data:
  caddy_data:

networks:
  tailortom:
    driver: bridge
